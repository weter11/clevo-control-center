<div>
    <!-- Fan Type Selector -->
    <div style="margin-bottom: 20px;">
        <mat-button-toggle-group [(value)]="activeFanType" (change)="setActiveFanType(activeFanType)">
            <mat-button-toggle value="CPU" i18n="@@fanSliderCPULabel">CPU Fan Curve</mat-button-toggle>
            <mat-button-toggle value="GPU" i18n="@@fanSliderGPULabel">GPU Fan Curve</mat-button-toggle>
        </mat-button-toggle-group>
    </div>

    <!-- CPU Fan Configuration -->
    <div *ngIf="activeFanType === 'CPU' && cpuFanPoints.length > 0">
        <div style="margin-bottom: 10px;">
            <button mat-raised-button color="primary" 
                (click)="addFanPoint('CPU')" 
                [disabled]="cpuFanPoints.length >= MAX_FAN_POINTS">
                <mat-icon>add</mat-icon>
                <span i18n="@@fanSliderAddPointLabel">Add Point</span>
            </button>
            <span style="margin-left: 10px;" i18n="@@fanSliderPointCountLabel">Points: {{ cpuFanPoints.length }} / {{ MAX_FAN_POINTS }}</span>
        </div>

        <div class="fan-points-container">
            <div class="fan-point" *ngFor="let fanTableEntry of cpuFanPoints; let i = index">
                <mat-slider vertical="true" thumbLabel color="primary"
                    [formControl]="fanFormGroupCPU.controls[fanTableEntry.temp+'c']" 
                    (change)="dirtyFanFormGroup()"
                    (change)="updateComponents($event.value, fanTableEntry.temp, 'CPU')">
                </mat-slider>
                <mat-form-field class="fan-point-temp-input" appearance="outline">
                    <input matInput type="number" 
                           [ngModel]="formatTempForInput(fanTableEntry.temp)"
                           (ngModelChange)="onTempChange(i, 'CPU', $event)"
                           [min]="config.getSettings().fahrenheit ? 32 : 0" 
                           [max]="config.getSettings().fahrenheit ? 212 : 100"
                           [attr.aria-label]="'Temperature for CPU point ' + (i + 1)">
                    <span matSuffix>{{ config.getSettings().fahrenheit ? '°F' : '°C' }}</span>
                </mat-form-field>
                <button mat-icon-button 
                    (click)="removeFanPoint('CPU', i)"
                    [disabled]="cpuFanPoints.length <= MIN_FAN_POINTS">
                    <mat-icon>remove_circle</mat-icon>
                </button>
            </div>
        </div>
    </div>

    <!-- GPU Fan Configuration -->
    <div *ngIf="activeFanType === 'GPU' && gpuFanPoints.length > 0">
        <div style="margin-bottom: 10px;">
            <button mat-raised-button color="primary" 
                (click)="addFanPoint('GPU')" 
                [disabled]="gpuFanPoints.length >= MAX_FAN_POINTS">
                <mat-icon>add</mat-icon>
                <span i18n="@@fanSliderAddPointLabel">Add Point</span>
            </button>
            <span style="margin-left: 10px;" i18n="@@fanSliderPointCountLabel">Points: {{ gpuFanPoints.length }} / {{ MAX_FAN_POINTS }}</span>
        </div>

        <div class="fan-points-container">
            <div class="fan-point" *ngFor="let fanTableEntry of gpuFanPoints; let i = index">
                <mat-slider vertical="true" thumbLabel color="primary"
                    [formControl]="fanFormGroupGPU.controls[fanTableEntry.temp+'c']" 
                    (change)="dirtyFanFormGroup()"
                    (change)="updateComponents($event.value, fanTableEntry.temp, 'GPU')">
                </mat-slider>
                <mat-form-field class="fan-point-temp-input" appearance="outline">
                    <input matInput type="number" 
                           [ngModel]="formatTempForInput(fanTableEntry.temp)"
                           (ngModelChange)="onTempChange(i, 'GPU', $event)"
                           [min]="config.getSettings().fahrenheit ? 32 : 0" 
                           [max]="config.getSettings().fahrenheit ? 212 : 100"
                           [attr.aria-label]="'Temperature for GPU point ' + (i + 1)">
                    <span matSuffix>{{ config.getSettings().fahrenheit ? '°F' : '°C' }}</span>
                </mat-form-field>
                <button mat-icon-button 
                    (click)="removeFanPoint('GPU', i)"
                    [disabled]="gpuFanPoints.length <= MIN_FAN_POINTS">
                    <mat-icon>remove_circle</mat-icon>
                </button>
            </div>
        </div>
    </div>

    <!-- Chart Toggle and Display -->
    <div class="fan-slider-container" style="margin-top: 20px;">
        <button mat-stroked-button (click)="toggleFanGraphs()">
            <ng-container i18n="@@cProfMgrDetailsToggleFanChartsLabel">Toggle fan table chart</ng-container>
            <mat-icon>bar_chart</mat-icon>
        </button>
    </div>

    <div *ngIf="showFanGraphs" style="display: block; height: 200px; margin-top: 20px;">
        <canvas id="hidden" baseChart class="tcc-charts" [chartType]="graphType" [datasets]="fantableDatasets"
            [colors]="graphColors" [labels]="tempsLabels" [options]="graphOptions">
        </canvas>
    </div>
</div>
