name: Build and Test

on:
  push:
    branches: [main, feature/advanced-fan-control]
  pull_request:
    branches: [main, feature/advanced-fan-control]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make libudev-dev
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14'
          cache: 'npm'

      - name: Setup Python 3.10 (for node-gyp compatibility)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @types/minimatch@3.0.5 --save-dev
          npm install @types/ms@0.7. 31
      
      - name: Build project
        run: npm run build
      
      - name: Create executables
        run: npm run pack-prod -- all
